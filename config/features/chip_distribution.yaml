chip_distribution:
  # 0.5% 对数分桶，适配不同价格尺度标的
  bin_size_pct: 0.005
  distribution: triangular
  turnover_cap: 1.0
  min_chip_pct: 0.000001

  # 默认读 silver 数据
  input_glob: data/silver/**/*.csv
  output_dir: outputs/chip_distribution

  # shares 配置（可按 symbol 覆盖）
  shares:
    symbol_shares:
      1810.HK: 25943162917
