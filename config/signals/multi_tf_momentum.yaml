multi_tf_momentum:
  # 5m 输入数据（必须是标准化后的 5m bars）
  input_csv: ""
  output_csv: outputs/signals/multi_tf_momentum.csv
  symbol: ""

  # 动量窗口
  window_5m: 6
  window_15m: 6

  # 最小阈值（收益率）
  threshold_5m: 0.003
  threshold_15m: 0.006

  # 15m 对齐规则：从 5m bars 重采样得到最近已完成的 15m close
  resample_rule_15m: 15min
