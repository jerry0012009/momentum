box_consolidation:
  ma_period: 20

  # 输入输出（可被命令行覆盖）
  input_csv: data/silver/hk/1810.HK_1d_5y_silver.csv
  output_csv: outputs/signals/1810.HK_box_consolidation.csv
  symbol: 1810.HK

  # 下跌后入箱
  decline_lookback: 60
  min_decline_pct: 0.12
  decline_recent_window: 20

  # 5日收盘高于历史阴线低点
  bearish_floor_lookback: 120
  floor_hold_days: 5

  # 窄幅震荡
  narrow_box_lookback: 20
  narrow_range_max: 0.08
  atr_period: 14
  narrow_atr_ratio_max: 0.025

  # 上涨浪确认窗口
  upwave_recent_window: 20

  # 箱体震荡与突破
  box_lookback: 30
  box_range_min: 0.08
  box_range_max: 0.30
  breakout_buffer: 0.0

  # 筹码过滤（可选）
  require_chip_filter: false
  chip_winner_min: 0.30
  chip_winner_max: 0.80
