meta:
  strategy_id: rank213_age90_14d_skip1d_voladj_top50_4x4
  candidate_rank: 213
  runner_mode: basket_live_canary
  status: live_canary_active
  purpose: age90 daily shadow_to_live_canary using reused rank213 basket shell

market:
  interval: 1d
  bar_minutes: 1440
  signal_timeframe: 1d
  official_close_only: true
  formation_days: 14
  skip_recent_days: 1
  hold_days: 1
  hold_bars: 1

strategy:
  variant: age90_14d_skip1d_voladj_top50_4x4
  baseline:
    long_count: 4
    short_count: 4
    weighting: equal_weight
    neutrality: market_neutral
  universe:
    method: previous_full_month_quote_volume_top50
    age_filter_days: 90
  score:
    formula: return_t_minus_15d_to_t_minus_1d_div_realized_vol_same_window
  gate:
    enabled: false
    live_gate_on: true
    note: no new gate is added at launch; avoid overfitting.
  veto:
    enabled: false

universe:
  target_mode: monthly_volume_top50_age90
  staged_enablement: true
  allowlist:
    enabled: false
    symbols: []
  denylist:
    enabled: false
    symbols: []

phase3:
  fr_monitor_root: /root/jerry/wlfi/FR_Monitor
  local_private_path: /root/clawd/jerry/momentum/config/private/fr_monitor_config_private.py

capital:
  mode: minimal_live_canary
  capital_deployed: false
  max_one_basket_at_a_time: true
  desired_gross_notional_usdt: 160.0
  desired_leg_notional_usdt: 20.0
  desired_leg_notional_usdt_by_symbol: {}
  min_leg_notional_usdt: 20.0
  min_notional_buffer_mult: 1.05
  default_leverage: 1

execution:
  venue: binance
  entry_cadence_minutes: 1440
  entry_trigger_second: 5
  official_entry_start_seconds_after_close: 120
  official_entry_end_seconds_after_close: 600
  shadow_publish_grace_seconds: 540
  maker_first: true
  post_only: true
  order_type: post_only_limit
  maker_offset_bps: 2.0
  ttl_seconds: 20
  allow_fallback_to_taker: true
  fallback_order_type: market
  fallback_tag: maker_ttl_to_taker
  max_signal_age_minutes: 10
  cancel_open_orders_before_fallback: true
  entry_fee_bps_maker: 2.0
  entry_fee_bps_taker: 5.0
  exit_fee_bps_maker: 2.0
  exit_fee_bps_taker: 5.0

rebalance:
  enabled: true
  mode: delta_symbol_side
  keep_same_symbol_same_side: true
  close_removed_legs: true
  open_added_legs: true
  resize_existing_legs: false
  min_resize_notional_usdt: 20.0
  allow_manual_test_window_override: false
  note: Same symbol and same side is carried; removed/flipped legs are closed; added/flipped legs are opened. Small notional drift is intentionally ignored.

phase6:
  mode: rank213_age90_live_canary
  venue: binance
  default_leverage: 1
  query_retry_attempts: 3
  query_retry_sleep_seconds: 0.5
  pending_manager:
    cadence_seconds: 5
    ttl_detection_sla_seconds: 10
  safety:
    max_signal_age_minutes: 10
    pause_new_entries_minutes_after_exit_attach_failure: 30
  sizing:
    desired_notional_usdt: 20.0
    desired_notional_usdt_by_symbol: {}
    min_notional_buffer_mult: 1.05
  entry:
    mode: maker_once_then_market
    order_type: limit_gtx
    limit_offset_bps: 2.0
    ttl_seconds: 20
    time_in_force: GTX
    fallback_to_market_on_ttl: true
    post_only_reject_policy: immediate_market
    allow_price_improvement_precheck: true
    max_reprices: 0
  exit:
    mode: horizon_only
    timeout_minutes: 1440

basket_controls:
  target_long_legs: 4
  target_short_legs: 4
  require_complete_basket: true
  min_filled_legs_total: 8
  min_filled_legs_per_side: 4
  max_missing_legs_total: 0
  max_nominal_imbalance_usdt: 8.0
  max_side_imbalance_usdt: 6.0

canary_controls:
  enabled: true
  live_order_placement_enabled: true
  max_one_basket_at_a_time: true
  cooldown_minutes_after_rejection: 15

safety:
  trade_enabled: true
  kill_switch: false
  dry_run_only: false
  query_account_before_after: true
  query_retry_attempts: 3
  query_retry_sleep_seconds: 0.5
  pause_new_entries_minutes_after_failure: 30
  cooldown_minutes_after_flatten: 30
  reject_if_data_stale: true
  reject_if_exchange_query_fails: true
  reject_if_basket_constraints_fail: true

shadow_parity:
  enabled: true
  shadow_status_path: /root/clawd/jerry/momentum/reports/artifacts/paper_rank213_age90_live/rank213_age90_shadow_status.json
  shadow_current_decision_path: /root/clawd/jerry/momentum/reports/artifacts/paper_rank213_age90_live/rank213_age90_shadow_current_decision.json
  shadow_recent_decisions_path: /root/clawd/jerry/momentum/reports/artifacts/paper_rank213_age90_live/rank213_age90_shadow_recent_decisions.csv
  shadow_events_path: /root/clawd/jerry/momentum/reports/artifacts/paper_rank213_age90_live/rank213_age90_shadow_events.jsonl
  enforce_same_bar_once: true
  enforce_signal_freshness: true

artifacts:
  root: /root/clawd/jerry/momentum/reports/artifacts/rank213_age90_live_canary
  config_snapshot_name: rank213_age90_live_canary_config_snapshot.yaml
  events_name: live_events.jsonl
  status_name: live_status.json
  state_name: live_state.json
  intentions_name: live_recent_intentions.json
  orders_name: live_recent_orders.json
  rejections_name: live_recent_rejections.json
  warnings_name: live_warnings.json

operator:
  readiness_note: phase3_positive_but_execution_sensitive
  launch_blocker: flatten_or_confirm_no_rank213_residual_positions_before_start
  note: Reuses the existing guarded rank213 basket live shell; only signal source and daily cadence differ.
