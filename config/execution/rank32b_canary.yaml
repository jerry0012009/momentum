    enabled: true
    name: global32b_live
    mode: global_live
    entry_cadence_minutes: 15
    entry_trigger_second: 5
    asset_to_symbol:
      BTC-USD: BTCUSDT
      ETH-USD: ETHUSDT
    desired_notional_usdt: 20.0
    desired_notional_usdt_by_symbol:
      BTCUSDT: 100.0
      ETHUSDT: 20.0
    max_concurrent_positions: 1
    max_daily_trades: 999
    max_position_notional_per_symbol: 300.0
    max_signal_age_minutes: 3
    conflict:
      state_paths:
        - /root/clawd/jerry/momentum/reports/artifacts/rank32b_canary/phase6_state.json
        - /root/clawd/jerry/momentum/reports/artifacts/rank29_gate_live/rank29_gate_live_state.json
      enabled_symbols:
        - BTCUSDT
        - ETHUSDT
  conflict:
    state_paths:
      - /root/clawd/jerry/momentum/reports/artifacts/rank32b_global_live/live_state.json
      - /root/clawd/jerry/momentum/reports/artifacts/rank29_gate_live/rank29_gate_live_state.json
    enabled_symbols:
      - BTCUSDT
      - ETHUSDT
  safety:
    pause_new_entries_minutes_after_exit_attach_failure: 0
    max_signal_age_minutes: 3
  selection:
    mode: strongest_signal_only
    strongest_only_per_bar: true
    strength_metric: slope_strength
  sizing:
    desired_notional_usdt: 20.0
    desired_notional_usdt_by_symbol:
      BTCUSDT: 100.0
      ETHUSDT: 20.0
    min_notional_buffer_mult: 1.0
  entry:
    order_type: market
    limit_offset_bps: 2.0
    ttl_minutes: 15
    time_in_force: GTX
    fallback_to_market_on_ttl: true
  exit:
    tp_atr_mult: 1.0
    sl_atr_mult: 1.0
    fallback_tp_bps_if_no_atr: 40.0
    fallback_sl_bps_if_no_atr: 40.0
    sl_working_type: CONTRACT_PRICE
    tp_time_in_force: GTC
    timeout_minutes: 120
    allow_soft_sl_fallback_on_attach_failure: true
universe:
  symbols:
  - BTCUSDT
  - ETHUSDT
  asset_to_symbol:
    BTC-USD: BTCUSDT
    ETH-USD: ETHUSDT
signal_adapter:
  variant: ema_cross_plus_slope_floor
  lookback_days: 30
  recent_hours: 72
  refresh_bars: true
  refresh_tail_days: 2
  preview_unclosed_15m: false
  preview_fetch_limit: 30
  entry_delay_minutes: 0
risk:
  trade_enabled: false
  kill_switch: true
  require_atr: true
  max_concurrent_positions: 1
  max_core_positions: 1
  max_daily_trades: 999
  max_position_notional_per_symbol: 300.0
  max_data_delay_seconds: 259200
execution:
  entry:
    order_type: post_only_limit
    maker_offset_bps: 2.0
    ttl_minutes: 15
    allow_fallback_to_taker: true
    qty: 1.0
notes:
  purpose: Phase 1 只落地 signal -> risk -> intention -> event log -> dashboard JSON。
    paper/manual 只用于最小轮次订单实验，不表示把整个 32b 项目退回 paper trade 阶段。
  isolation: 本 canary 必须独立于 bot2 / bot3 / bot6 / bot7 的既有定时任务链路。
