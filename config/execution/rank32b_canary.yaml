run_mode: dry_run_phase1
phase2:
  broker_mode: test_no_fill
  purpose: minimal_isolated_receipt_chain_experiment
  capital_deployed: false
  cancel_after_ack: true
phase3:
  fr_monitor_root: /root/jerry/wlfi/FR_Monitor
  local_private_path: /root/clawd/jerry/momentum/config/private/fr_monitor_config_private.py
  query_only: true
  venues:
    binance: true
    lighter: true
  lighter:
    disable_proxy_for_query: true
  ttl_scan:
    enabled: true
    default_entry_ttl_minutes: 15
phase4:
  venue: binance
  use_test_order: true
  symbol: ETHUSDT
  side: BUY
  quantity: 0.01
  reduce_only: false
  query_account_before_after: true
  capital_deployed: false
phase5:
  venue: binance
  symbol: ETHUSDT
  side: BUY
  desired_notional_usdt: 8.0
  min_notional_buffer_mult: 1.0
  limit_offset_bps: 300.0
  time_in_force: GTX
  query_retry_attempts: 3
  query_retry_sleep_seconds: 0.6
  query_account_before_after: true
  cancel_immediately_after_ack: true
  capital_deployed_target: minimal_live_order
phase6:
  mode: live_canary
  venue: binance
  default_leverage: 1
  max_new_signals_per_run: 1
  query_retry_attempts: 3
  query_retry_sleep_seconds: 0.5
  smallcap:
    enabled: false
    max_concurrent_positions: 0
    max_new_signals_per_run: 0
    symbols: []
    activity_filter:
      enabled: true
      recent_days: 7
      lookback_days: 120
      min_percentile: 0.50
      cache_ttl_minutes: 360
  shadow:
    enabled: true
    name: Alt shadow sidecar
    bucket: alt
    asset_to_symbol:
      LTC-USD: LTCUSDT
      NEAR-USD: NEARUSDT
      UNI-USD: UNIUSDT
      XRP-USD: XRPUSDT
      DOGE-USD: DOGEUSDT
      BNB-USD: BNBUSDT
      ADA-USD: ADAUSDT
      AVAX-USD: AVAXUSDT
      LINK-USD: LINKUSDT
      BCH-USD: BCHUSDT
      DOT-USD: DOTUSDT
      ZEC-USD: ZECUSDT
      AAVE-USD: AAVEUSDT
      SUI-USD: SUIUSDT
      WLD-USD: WLDUSDT
      TRADOOR-USD: TRADOORUSDT
      PIPPIN-USD: PIPPINUSDT
      ACT-USD: ACTUSDT
      BRETT-USD: BRETTUSDT
      TURBO-USD: TURBOUSDT
      FARTCOIN-USD: FARTCOINUSDT
      1000PEPE-USD: 1000PEPEUSDT
      BEAT-USD: BEATUSDT
    recent_hours: 240
    tail_signals: 1000
    apply_smallcap_activity_filter: false
    paper:
      enabled: true
      entry_style: taker
      entry_ttl_5m_bars: 3
      market_cost_bps: 6.0
      tp_atr_mult: 1.25
      sl_atr_mult: 1.0
      timeout_15m: 8
      max_concurrent_positions: 1
      fallback_tp_bps: 40.0
      fallback_sl_bps: 40.0
      depth_v2:
        enabled: true
        order_notional_usdt: 500.0
        depth_limit: 20
        reject_if_insufficient_depth: true
        min_depth_fill_ratio: 0.98
        entry_fee_bps: 6.0
        exit_fee_bps: 6.0
  shadow_global:
    enabled: true
    name: Global strongest-only shadow
    bucket: all26
    asset_to_symbol:
      BTC-USD: BTCUSDT
      ETH-USD: ETHUSDT
      SOL-USD: SOLUSDT
      LTC-USD: LTCUSDT
      NEAR-USD: NEARUSDT
      UNI-USD: UNIUSDT
      XRP-USD: XRPUSDT
      DOGE-USD: DOGEUSDT
      BNB-USD: BNBUSDT
      ADA-USD: ADAUSDT
      AVAX-USD: AVAXUSDT
      LINK-USD: LINKUSDT
      BCH-USD: BCHUSDT
      DOT-USD: DOTUSDT
      ZEC-USD: ZECUSDT
      AAVE-USD: AAVEUSDT
      SUI-USD: SUIUSDT
      WLD-USD: WLDUSDT
      TRADOOR-USD: TRADOORUSDT
      PIPPIN-USD: PIPPINUSDT
      ACT-USD: ACTUSDT
      BRETT-USD: BRETTUSDT
      TURBO-USD: TURBOUSDT
      FARTCOIN-USD: FARTCOINUSDT
      1000PEPE-USD: 1000PEPEUSDT
      BEAT-USD: BEATUSDT
    recent_hours: 240
    tail_signals: 1000
    selection:
      strongest_only_per_bar: true
      strength_metric: slope_strength
    paper:
      enabled: true
      entry_style: taker
      entry_ttl_5m_bars: 3
      market_cost_bps: 6.0
      tp_atr_mult: 1.75
      sl_atr_mult: 1.0
      timeout_15m: 8
      max_concurrent_positions: 3
      fallback_tp_bps: 40.0
      fallback_sl_bps: 40.0
      depth_v2:
        enabled: true
        order_notional_usdt: 100.0
        order_notional_usdt_by_symbol:
          TRADOORUSDT: 40.0
          PIPPINUSDT: 40.0
          ACTUSDT: 40.0
          BRETTUSDT: 40.0
          TURBOUSDT: 40.0
          FARTCOINUSDT: 40.0
          1000PEPEUSDT: 40.0
          BEATUSDT: 40.0
        depth_limit: 20
        reject_if_insufficient_depth: true
        min_depth_fill_ratio: 0.98
        entry_fee_bps: 6.0
        exit_fee_bps: 6.0
      live_parity:
        enabled: true
        scheduler_interval_minutes: 1
        same_bar_once: true
        same_bar_minutes: 15
        same_symbol_single_position: true
        ignore_cross_lane: true
        enforce_signal_freshness: true
        max_signal_age_minutes: 3
        exit_check_interval_minutes: 1
        monitor_from_next_minute_bar: true
        kline_1m_cache:
          cooldown_seconds: 120
          max_staleness_minutes: 2
          tail_overlap_minutes: 3
          request_pause_seconds: 0.2
          http_retries: 5
          http_timeout_seconds: 20
