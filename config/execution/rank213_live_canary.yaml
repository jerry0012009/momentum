meta:
  strategy_id: rank213_largecap_xs_jump_veto
  candidate_rank: 213
  runner_mode: basket_live_canary
  status: draft_for_dry_run
  purpose: rank213 shadow_to_dryrun_to_live_canary

market:
  interval: 15m
  bar_minutes: 15
  signal_timeframe: 15m
  official_close_only: true
  formation_bars: 64
  hold_bars: 12

strategy:
  variant: f64_h12_floor150_mult2p0
  baseline:
    long_count: 3
    short_count: 3
    weighting: equal_weight
    neutrality: market_neutral
  veto:
    enabled: true
    description: short candidate veto if formation-window max 15m jump >= max(1.5%, 2.0x market median max-up-bar)
    min_jump_pct: 0.015
    market_median_mult: 2.0
    apply_to: shorts_only
    refill_after_veto: true
  gate:
    enabled: true
    lookback_days: 30
    vote_ratio_threshold: 0.67
    require_votes_ge_ceil_valid_rules_x_ratio: true
    when_off: flat

universe:
  target_mode: full_candidate_pool
  staged_enablement: true
  symbols:
    - 1000PEPEUSDT
    - ADAUSDT
    - AVAXUSDT
    - B3USDT
    - BCHUSDT
    - BNBUSDT
    - BTCUSDT
    - CUSDT
    - DOGEUSDT
    - DOTUSDT
    - ENAUSDT
    - ETHUSDT
    - FILUSDT
    - HYPEUSDT
    - KNCUSDT
    - LINKUSDT
    - ONTUSDT
    - ONUSDT
    - PIPPINUSDT
    - PIXELUSDT
    - QUSDT
    - RIVERUSDT
    - SIRENUSDT
    - STGUSDT
    - SUIUSDT
    - TAOUSDT
    - WLDUSDT
    - ZECUSDT
    - SOLUSDT
    - XRPUSDT
  allowlist:
    enabled: false
    symbols: []
  denylist:
    enabled: false
    symbols: []

phase3:
  fr_monitor_root: /root/jerry/wlfi/FR_Monitor
  local_private_path: /root/clawd/jerry/momentum/config/private/fr_monitor_config_private.py

capital:
  mode: minimal_live_canary
  capital_deployed: false
  max_one_basket_at_a_time: true
  desired_gross_notional_usdt: 120.0
  desired_leg_notional_usdt: 20.0
  desired_leg_notional_usdt_by_symbol: {}
  min_leg_notional_usdt: 20.0
  min_notional_buffer_mult: 1.05
  default_leverage: 1

execution:
  venue: binance
  entry_cadence_minutes: 15
  entry_trigger_second: 5
  official_entry_start_seconds_after_close: 120
  official_entry_end_seconds_after_close: 300
  shadow_publish_grace_seconds: 240
  maker_first: true
  post_only: true
  order_type: post_only_limit
  maker_offset_bps: 2.0
  ttl_seconds: 20
  allow_fallback_to_taker: true
  fallback_order_type: market
  fallback_tag: maker_ttl_to_taker
  max_signal_age_minutes: 3
  cancel_open_orders_before_fallback: true
  entry_fee_bps_maker: 2.0
  entry_fee_bps_taker: 5.0
  exit_fee_bps_maker: 2.0
  exit_fee_bps_taker: 5.0

phase6:
  mode: rank213_live_canary
  venue: binance
  default_leverage: 1
  query_retry_attempts: 3
  query_retry_sleep_seconds: 0.5
  pending_manager:
    cadence_seconds: 5
    ttl_detection_sla_seconds: 10
  safety:
    max_signal_age_minutes: 3
    pause_new_entries_minutes_after_exit_attach_failure: 30
  sizing:
    desired_notional_usdt: 20.0
    desired_notional_usdt_by_symbol: {}
    min_notional_buffer_mult: 1.05
  entry:
    mode: maker_once_then_market
    order_type: limit_gtx
    limit_offset_bps: 2.0
    ttl_seconds: 20
    time_in_force: GTX
    fallback_to_market_on_ttl: true
    post_only_reject_policy: immediate_market
    allow_price_improvement_precheck: true
    max_reprices: 0
  exit:
    mode: horizon_only
    timeout_minutes: 180

basket_controls:
  target_long_legs: 3
  target_short_legs: 3
  require_complete_basket: true

canary_controls:
  enabled: true
  live_order_placement_enabled: true
  max_one_basket_at_a_time: true
  cooldown_minutes_after_rejection: 15


safety:
  trade_enabled: true
  kill_switch: false
  dry_run_only: false
  query_account_before_after: true
  query_retry_attempts: 3
  query_retry_sleep_seconds: 0.5
  pause_new_entries_minutes_after_failure: 30
  cooldown_minutes_after_flatten: 30
  reject_if_data_stale: true
  reject_if_exchange_query_fails: true
  reject_if_basket_constraints_fail: true

shadow_parity:
  enabled: true
  shadow_status_path: /root/clawd/jerry/momentum/reports/artifacts/paper_rank213_largecap_xs_jump_veto/rank213_shadow_status.json
  shadow_current_decision_path: /root/clawd/jerry/momentum/reports/artifacts/paper_rank213_largecap_xs_jump_veto/rank213_shadow_current_decision.json
  shadow_recent_decisions_path: /root/clawd/jerry/momentum/reports/artifacts/paper_rank213_largecap_xs_jump_veto/rank213_shadow_recent_decisions.csv
  shadow_events_path: /root/clawd/jerry/momentum/reports/artifacts/paper_rank213_largecap_xs_jump_veto/rank213_shadow_events.jsonl
  enforce_same_bar_once: true
  enforce_signal_freshness: true

artifacts:
  root: /root/clawd/jerry/momentum/reports/artifacts/rank213_live_canary
  config_snapshot_name: rank213_live_canary_config_snapshot.yaml
  events_name: live_events.jsonl
  status_name: live_status.json
  state_name: live_state.json
  intentions_name: live_recent_intentions.json
  orders_name: live_recent_orders.json
  rejections_name: live_recent_rejections.json
  warnings_name: live_warnings.json

operator:
  readiness_note: short_window_proven_long_window_not_proven
  honesty_requirement: expose_readiness_gap_and_execution_deviation
  note: as-of long-history evidence supports progression, but live must remain canary-grade until shadow parity and execution audit are stable.
